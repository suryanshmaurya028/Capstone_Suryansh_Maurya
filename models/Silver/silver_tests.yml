version: 2

models:

  - name: silver_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['Young', 'Middle-aged', 'Senior', 'Unknown']

  - name: silver_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: silver_stores
    columns:
      - name: store_id
        tests:
          - unique
          - not_null
      - name: store_size_category
        tests:
          - accepted_values:
              values: ['Small', 'Medium', 'Large', 'Unknown']

  - name: silver_suppliers
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null

  - name: silver_campaigns
    columns:
      - name: campaign_id
        tests:
          - unique
          - not_null

  - name: silver_employees
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null

  - name: silver_orders
    columns:
      - name: delivery_status
        tests:
          - accepted_values:
              values: ['On Time', 'Delayed', 'Potentially Delayed', 'In Transit']
      - name: order_status
        tests:
          - not_null

  - name: silver_order_summary
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: delivery_status
        tests:
          - accepted_values:
              values: ['On Time', 'Delayed', 'Potentially Delayed', 'In Transit']

  - name: silver_inventory
    columns:
      - name: product_id
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
